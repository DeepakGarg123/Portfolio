<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent — Navjot Singh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #050b1f;
      --blue: #1a6bff;
      --cyan: #00d4ff;
      --white: #ffffff;
      --glass-bg: rgba(10,21,53,0.55);
      --glass-bd: rgba(0,212,255,0.18);
    }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow: hidden;
    }

    /* Animated background dots */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(26,107,255,0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0,212,255,0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      position: relative;
      max-width: 560px;
      width: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-bd);
      border-radius: 28px;
      padding: 60px 48px;
      text-align: center;
      backdrop-filter: blur(24px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.4), 0 0 60px rgba(0,212,255,0.08);
      animation: fadeUp .7s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Checkmark circle */
    .check-wrap {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c875, #00d4ff);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      box-shadow: 0 0 50px rgba(0,212,255,0.4);
      animation: pop .5s .3s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .check-wrap svg {
      width: 44px;
      height: 44px;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      animation: drawCheck .5s .8s ease forwards;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 14px;
      letter-spacing: -.02em;
    }

    h1 span {
      background: linear-gradient(135deg, #3d8bff, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: rgba(255,255,255,0.6);
      font-size: 1rem;
      line-height: 1.75;
      margin-bottom: 12px;
    }

    .email-tag {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 50px;
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.3);
      color: var(--cyan);
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 36px;
      letter-spacing: .04em;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      border-radius: 3px;
      margin: 0 auto 36px;
    }

    .btn-back {
      display: inline-block;
      padding: 14px 36px;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: .95rem;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: .04em;
      box-shadow: 0 0 30px rgba(26,107,255,0.45);
      transition: transform .3s, box-shadow .3s;
    }

    .btn-back:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 50px rgba(0,212,255,0.55);
    }

    .footer-note {
      margin-top: 28px;
      font-size: .78rem;
      color: rgba(255,255,255,0.3);
    }

    /* Auto-redirect countdown */
    #countdown { color: var(--cyan); font-weight: 700; }

    @media (max-width: 500px) {
      .card { padding: 40px 28px; }
      h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="check-wrap">
      <svg viewBox="0 0 52 52">
        <polyline points="14,27 22,36 38,18" />
      </svg>
    </div>

    <h1>Message <span>Received!</span></h1>
    <p>Thank you for reaching out! Your project details have been sent directly to Navjot's inbox.</p>
    <div class="email-tag">📬 brandblink222@gmail.com</div>
    <div class="divider"></div>
    <p>I'll review your inquiry and get back to you as soon as possible — usually within <strong style="color:#fff">24 hours</strong>.</p>

    <a href="index.html" class="btn-back">← Back to Portfolio</a>
    <p class="footer-note">Redirecting automatically in <span id="countdown">8</span> seconds…</p>
  </div>

  <script>
    // Auto-redirect countdown
    let secs = 8;
    const el = document.getElementById('countdown');
    const timer = setInterval(function () {
      secs--;
      if (el) el.textContent = secs;
      if (secs <= 0) {
        clearInterval(timer);
        window.location.href = 'index.html';
      }
    }, 1000);
  </script>

</body>
</html>
