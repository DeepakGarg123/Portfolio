<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cvg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#cvg)"/>
  <circle cx="50" cy="45" r="24" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="50" y="55" font-family="Georgia,serif" font-size="34" font-weight="900" fill="white" text-anchor="middle" font-style="italic" filter="url(#shadow)">Ca</text>
  <text x="50" y="80" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="1.5">CANVA</text>
