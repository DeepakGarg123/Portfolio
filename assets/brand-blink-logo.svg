<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="darkTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="42" cy="40" r="32" fill="#00d4ff" opacity="0.18" filter="url(#neonGlow)" />

  <!-- Geometric "B" Ribbon Emblem -->
  <g transform="translate(14, 10)">
    <!-- Base ribbon structure -->
    <path d="M6 6 H34 V28 H18 L36 46 V58 H6 Z" fill="url(#darkTeal)" opacity="0.85" />
    <path d="M6 6 H28 L14 24 H6 Z" fill="url(#tealGrad)" />
    <path d="M14 24 L34 6 L44 16 L24 34 Z" fill="url(#bgGrad)" />
    <path d="M6 32 L22 16 L28 22 L12 38 Z" fill="url(#tealGrad)" />
    <path d="M6 36 H24 L44 56 H24 Z" fill="url(#darkTeal)" />
    <path d="M12 38 L32 58 H46 L24 36 Z" fill="url(#bgGrad)" filter="url(#neonGlow)" />
    <path d="M18 42 C26 42 36 46 36 52 C36 58 26 58 18 58 Z" fill="none" stroke="url(#bgGrad)" stroke-width="3" />

    <!-- 4-Point Sparkling Star (Blink) -->
    <g transform="translate(42, 6)">
      <path d="M0 -12 C1 -3 3 -1 12 0 C3 1 1 3 0 12 C-1 3 -3 1 -12 0 C-3 -1 -1 -3 0 -12 Z" fill="url(#starGrad)" filter="url(#neonGlow)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
      <!-- Small secondary sparkle -->
      <path d="M12 -8 C12.5 -5 13.5 -4 16 -3.5 C13.5 -3 12.5 -2 12 1 C11.5 -2 10.5 -3 8 -3.5 C10.5 -4 11.5 -5 12 -8 Z" fill="#67e8f9" />
    </g>
  </g>

  <!-- Typography: BRAND BLINK -->
  <g transform="translate(86, 0)">
    <!-- Subtitle: BRAND -->
    <text x="0" y="32" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" letter-spacing="4.5" fill="rgba(255,255,255,0.75)">BRAND</text>
    
    <!-- Title: BLINK -->
    <text x="0" y="58" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="url(#textGrad)" filter="url(#neonGlow)">BLINK</text>
    
    <!-- Sparkle accent next to BLINK -->
    <text x="100" y="54" font-family="sans-serif" font-size="16" fill="#00d4ff" filter="url(#neonGlow)">✦</text>
  </g>
</svg>

